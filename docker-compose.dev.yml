services:
  mysql:
    image: mysql:8.0
    container_name: skan-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: skan
      MYSQL_USER: skan
      MYSQL_PASSWORD: skan123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: skan-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
